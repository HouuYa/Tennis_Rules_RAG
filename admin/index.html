<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Tennis Rules RAG</title>
    <style>
        :root {
            --primary-bg: #1a1c23;
            --card-bg: #242632;
            --text-main: #ffffff;
            --text-dim: #9e9e9e;
            --accent: #d4e157;
            --error: #ff5252;
            --input-bg: #1a1c23;
            --input-border: #3f414e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            gap: 10px;
        }

        .header h2 {
            font-size: 20px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .icon-shield {
            color: var(--accent);
            font-size: 40px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 16px;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .error-msg {
            color: var(--error);
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            border: none;
            border-radius: 8px;
            color: #000;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .hint {
            margin-top: 25px;
            font-size: 11px;
            color: #555;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--text-dim);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
        }

        .back-link:hover {
            color: var(--text-main);
        }
    </style>
</head>

<body>
    <a href="/" class="back-link">← Admin Access</a>

    <div class="login-container">
        <div class="header">
            <div class="icon-shield">🛡️</div>
        </div>
        <h1>Admin Login</h1>
        <p class="subtitle">Enter credentials to manage data</p>

        <div class="form-group">
            <label for="adminId">ID</label>
            <input type="text" id="adminId" placeholder="ID 입력">
        </div>

        <div class="form-group">
            <label for="adminPw">PASSWORD</label>
            <input type="password" id="adminPw" placeholder="PASSWORD 입력">
        </div>

        <div id="errorMsg" class="error-msg">Invalid credentials</div>

        <button class="login-btn" onclick="handleLogin()">Login</button>

        <p class="hint">Netlify 환경변수에 ADMIN_ID, ADMIN_PASSWORD 설정 필요</p>
    </div>

    <script>
        // Netlify Functions를 사용하지 않고 우선 클라이언트 사이드에서 환경변수를 전달받는 방식은 보안상 어렵습니다.
        // 하지만 요청하신 스크린샷의 형태를 유지하면서 동작하게 하기 위해,
        // 서버에서 index.html을 서빙할 때 환경변수를 주입하거나, 별도의 Auth Function을 두는것이 맞지만,
        // 현재는 Static HTML 구조이므로 세션 스토리지에 저장하고 index.html에서 체크하는 방식으로 구현하겠습니다.

        async function handleLogin() {
            const id = document.getElementById('adminId').value;
            const pw = document.getElementById('adminPw').value;
            const errorMsg = document.getElementById('errorMsg');

            if (!id || !pw) {
                errorMsg.textContent = "ID와 PASSWORD를 입력해주세요.";
                errorMsg.style.display = "block";
                return;
            }

            // 보안을 위해 이 부분은 실제로는 Netlify Function 등을 통해 서버측 검증을 해야 함.
            // 하지만 유저가 요청한 "Netlify 환경변수 설정"과의 연동을 보여주기 위해
            // 여기서는 로직을 index.html로 넘기고, index.html에서 API 호출 시 검증하는 흐름을 제안합니다.

            // 임시로 세션 스토리지에 저장
            sessionStorage.setItem('admin_id', id);
            sessionStorage.setItem('admin_pw', pw);

            // 대시보드로 이동
            window.location.href = 'dashboard.html';
        }

        // Enter 키 지원
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleLogin();
            });
        });
    </script>
</body>

</html>
