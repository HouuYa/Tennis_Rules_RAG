<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITF 테니스 규칙 AI 전문가 | Tennis Rules RAG</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Noto+Sans+KR:wght@300;400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #764ba2;
            --primary-light: #667eea;
            --accent: #d4e157;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --text-main: #2d3436;
            --text-dim: #636e72;
            --bot-bubble: #ffffff;
            --user-bubble: #667eea;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: var(--text-main);
        }

        .container {
            background: var(--glass-bg);
            border-radius: 24px;
            box-shadow: var(--shadow);
            max-width: 900px;
            width: 100%;
            height: 92vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Header Styling */
        .header {
            padding: 20px 25px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .header-title h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-title p {
            font-size: 12px;
            color: var(--text-dim);
        }

        .nav-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .admin-link {
            text-decoration: none;
            font-size: 20px;
            transition: transform 0.2s;
        }

        .admin-link:hover {
            transform: rotate(45deg);
        }

        /* Config Section */
        .config-overlay {
            padding: 15px 25px;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-wrapper label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .config-overlay input,
        .config-overlay select {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 13px;
            font-family: inherit;
        }

        .config-overlay input:focus,
        .config-overlay select:focus {
            outline: none;
            border-color: var(--primary-light);
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            background: #fdfdfd;
            scroll-behavior: smooth;
        }

        .message {
            margin-bottom: 25px;
            display: flex;
            gap: 12px;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .message.user .avatar {
            background: var(--primary-light);
            color: white;
        }

        .message.bot .avatar {
            background: var(--primary);
            color: white;
        }

        .bubble {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            position: relative;
        }

        .message.user .bubble {
            background: var(--user-bubble);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .bubble {
            background: var(--bot-bubble);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid #f0f0f0;
        }

        /* Bot Content Formatting (HTML) */
        .bubble p {
            margin-bottom: 12px;
        }

        .bubble ul,
        .bubble ol {
            margin-bottom: 12px;
            padding-left: 20px;
        }

        .bubble li {
            margin-bottom: 6px;
        }

        .bubble strong {
            color: var(--primary);
        }

        .bubble sup {
            color: var(--primary-light);
            font-weight: bold;
            margin-left: 2px;
        }

        .bubble hr {
            border: 0;
            border-top: 1px solid #eee;
            margin: 15px 0;
        }

        .bubble h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: var(--primary);
        }

        /* Sources Styling */
        .sources-dropdown {
            margin-top: 15px;
            font-size: 12px;
        }

        .sources-toggle {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
            padding: 5px 0;
            user-select: none;
        }

        .sources-content {
            margin-top: 10px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 12px;
            display: none;
        }

        .source-card {
            background: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid var(--accent);
        }

        .source-card-header {
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .source-card-body {
            color: var(--text-dim);
            font-size: 11px;
            max-height: 100px;
            overflow-y: auto;
        }

        /* Input Area */
        .input-area {
            padding: 20px 25px;
            background: white;
            border-top: 1px solid #eee;
        }

        .input-group {
            display: flex;
            gap: 12px;
            background: #f8f9fa;
            padding: 8px;
            border-radius: 100px;
            border: 1px solid #eee;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-group:focus-within {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.1);
        }

        .input-group input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-family: inherit;
        }

        .input-group input:focus {
            outline: none;
        }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .send-btn:hover:not(:disabled) {
            background: var(--primary-light);
            transform: scale(1.05);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Loading Dots */
        .loading-dots {
            display: flex;
            gap: 4px;
            padding: 10px 0;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--primary-light);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        @media (max-width: 600px) {
            .container {
                height: 100vh;
                border-radius: 0;
            }

            .bubble {
                max-width: 90%;
            }

            .config-overlay {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="header-title">
                <h1>🎾 ITF RuleExpert</h1>
                <p>테니스 규칙 RAG 시스템 (Beta)</p>
            </div>
            <div class="nav-actions">
                <a href="/admin" class="admin-link" title="관리자 설정">⚙️</a>
            </div>
        </header>

        <section class="config-overlay">
            <div class="input-wrapper">
                <label for="geminiApiKey">Gemini API Key</label>
                <input type="password" id="geminiApiKey" placeholder="API 키를 입력하세요">
            </div>
            <div class="input-wrapper">
                <label for="geminiModel">Selected Model</label>
                <select id="geminiModel">
                    <option value="gemini-2.0-flash">Gemini 2.0 Flash (Fastest)</option>
                    <option value="gemini-1.5-flash" selected>Gemini 1.5 Flash (Balanced)</option>
                    <option value="gemini-1.5-pro">Gemini 1.5 Pro (Powerful)</option>
                </select>
            </div>
        </section>

        <div class="chat-area" id="chatArea">
            <!-- Messages will be injected here -->
            <div class="message bot">
                <div class="avatar">🤖</div>
                <div class="bubble">
                    <p>반갑습니다! 저는 <strong>ITF(국제테니스연맹)</strong> 규칙 전문가입니다. 궁금하신 테니스 규칙을 물어봐 주세요.</p>
                    <p><small>예: "매치 타이브레이크는 어떻게 진행되나요?", "렛 상황에 대해 설명해줘"</small></p>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-group">
                <input type="text" id="questionInput" placeholder="테니스 규칙에 대해 질문하세요..." autocomplete="off">
                <button onclick="sendQuestion()" id="sendBtn" class="send-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const EDGE_FUNCTION_URL = 'https://ctzcgrwjsrvoxjycwtya.supabase.co/functions/v1/tennis-rag-query';

        // Load saved config
        document.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            const savedModel = localStorage.getItem('gemini_model');
            if (savedKey) document.getElementById('geminiApiKey').value = savedKey;
            if (savedModel) document.getElementById('geminiModel').value = savedModel;

            // Focus input
            document.getElementById('questionInput').focus();
        });

        // Save config on change
        document.getElementById('geminiApiKey').addEventListener('change', (e) => localStorage.setItem('gemini_api_key', e.target.value));
        document.getElementById('geminiModel').addEventListener('change', (e) => localStorage.setItem('gemini_model', e.target.value));

        // Enter key handling
        document.getElementById('questionInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendQuestion();
        });

        function addMessage(text, isUser, sources = null) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = isUser ? '👤' : '🤖';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            if (isUser) {
                bubble.textContent = text;
            } else {
                // Backend expects HTML, so we use innerHTML for bot responses.
                // The prompt instructions strictly guide the LLM to use specific tags.
                bubble.innerHTML = text;

                if (sources && sources.length > 0) {
                    const dropdown = document.createElement('div');
                    dropdown.className = 'sources-dropdown';

                    const toggle = document.createElement('div');
                    toggle.className = 'sources-toggle';
                    toggle.innerHTML = '<span>📚</span> <strong>참고 문헌 보기</strong> (' + sources.length + ')';

                    const content = document.createElement('div');
                    content.className = 'sources-content';

                    sources.forEach((s, i) => {
                        const card = document.createElement('div');
                        card.className = 'source-card';
                        card.innerHTML = `
                            <div class="source-card-header">
                                <span>[${i + 1}] ${s.rule_id}</span>
                                <small>${(s.similarity * 100).toFixed(1)}%</small>
                            </div>
                            <div class="source-card-body">${s.content}</div>
                        `;
                        content.appendChild(card);
                    });

                    toggle.onclick = () => {
                        const isOpen = content.style.display === 'block';
                        content.style.display = isOpen ? 'none' : 'block';
                    };

                    dropdown.appendChild(toggle);
                    dropdown.appendChild(content);
                    bubble.appendChild(dropdown);
                }
            }

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(bubble);
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        async function sendQuestion() {
            const questionInput = document.getElementById('questionInput');
            const geminiApiKey = document.getElementById('geminiApiKey').value.trim();
            const geminiModel = document.getElementById('geminiModel').value;
            const question = questionInput.value.trim();

            if (!geminiApiKey) { alert('Gemini API Key를 입력해주세요.'); return; }
            if (!question) return;

            // UI Update
            addMessage(question, true);
            questionInput.value = '';
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;

            // Loading indicator
            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'message bot';
            loadingMsg.id = 'temp-loading';
            loadingMsg.innerHTML = `
                <div class="avatar">🤖</div>
                <div class="bubble"><div class="loading-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>
            `;
            document.getElementById('chatArea').appendChild(loadingMsg);
            document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;

            try {
                const response = await fetch(EDGE_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: question,
                        gemini_api_key: geminiApiKey,
                        model: geminiModel,  // CRITICAL: Required by backend
                        match_count: 5,
                        match_threshold: 0.25
                    })
                });

                document.getElementById('temp-loading').remove();

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || '서버 오류');
                }

                const data = await response.json();
                addMessage(data.answer, false, data.sources);

            } catch (error) {
                if (document.getElementById('temp-loading')) document.getElementById('temp-loading').remove();
                addMessage(`❌ 오류가 발생했습니다: ${error.message}`, false);
                console.error('Error:', error);
            } finally {
                sendBtn.disabled = false;
            }
        }
    </script>
</body>

</html>
